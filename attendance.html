<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Attendance Sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Georgia, 'Times New Roman', Times, serif;
background:linear-gradient(120deg,#4facfe,#00f2fe);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
}

.card{
background:white;
width:95%;
max-width:800px;
padding:40px;
border-radius:12px;
box-shadow:0 15px 30px rgba(0,0,0,0.2);
}

h1{
text-align:center;
color:#053b60;
font-size:22px;
margin-bottom:10px;
}

h2{
text-align:center;
color:#053b60;
font-size:16px;
margin-bottom:20px;
}

.controls{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
margin-bottom:20px;
}

select,button{
padding:8px;
font-size:13px;
border-radius:6px;
border:1px solid #0b5592;
}

button {
padding: 8px 15px;
font-size: 14px;
border: none;
border-radius: 6px;
background: #05457e;
color: #fff;
cursor: pointer;
width: 100%;
max-width: 150px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
font-size:13px;
}

th{
background:#0b3c5d;
color:white;
}

tr:nth-child(even){
background:#f5f8ff;
}

.logo{
display:block;
margin:0 auto 10px auto;
max-width:100px;
}
.note {
text-align: center;
margin-top: 12px;
color: #0e4791;
font-weight: bold;
font-size: 12px;
}
.attendance-btn {
  width: 42px;
  min-width: 42px;
  max-width: 42px;
  padding: 7px 0;
  border: none;
  border-radius: 5px;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
}

.attendance-btn.present {
  background: #16803c;
  color: white;
}

.attendance-btn.absent {
  background: #c62828;
  color: white;
}

.attendance-btn:hover {
  opacity: 0.85;
}
#attendanceControls .all-present {
  background: #16803c;
}

#attendanceControls .all-absent {
  background: #c62828;
}
#attendanceControls .all-present,
#attendanceControls .all-absent {
  margin: 0 10px;
}

@media (max-width: 600px){

.controls{
flex-direction:column;
align-items:center;
}

select, button{
width:70%;
max-width:140px;
font-size:12px;
padding:8px;
margin-top: 5px;
}

button{
width:54%;
max-width:300px;
padding:10px;
font-size:12px;
}

th, td{
font-size:11px;
padding:6px;
}
.card{
padding:30px 10px;
}
h1{
font-size:18px;
}
h2{
font-size:16px;
}
#attendanceControls .all-absent {
    margin-top: 10px !important;
}
#downloadSection button + button {
    margin-top: 10px !important;
    padding: 6px, 10px;
}
}


</style>
</head>

<body>

<div class="card">

<img src="gecm_logo.jpg" class="logo">

<h1>Government Engineering College Munger</h1>
<h2>Attendance Sheet</h2>

<div class="controls">

<select id="branch">
<option value="">Select Branch</option>
<option value="CE (GA)">CE (GA)</option>
<option value="CE (GB)">CE (GB)</option>
<option value="CSE (DS)">CSE (DS)</option>
<option value="CSE (AI)">CSE (AI)</option>
<option value="CSE (M&C)">CSE (M&C)</option>
<option value="EE">EE</option>
<option value="ME">ME</option>
</select>

<select id="semester">
<option value="">Select Semester</option>
<option value="1">Sem 1</option>
<option value="2">Sem 2</option>
<option value="3">Sem 3</option>
<option value="4">Sem 4</option>
<option value="5">Sem 5</option>
<option value="6">Sem 6</option>
<option value="7">Sem 7</option>
<option value="8">Sem 8</option>
</select>

<button onclick="loadStudents()">Search</button>

</div>

<div id="classInfo" style="
text-align:center;
margin-top:5px;
font-size:14px;
font-weight:bold;
color:#0b3c5d;">
</div>

<div id="attendanceControls" style="display:none; text-align:center; margin:12px 0;">

<button type="button"
  class="all-present"
  onclick="markAllAttendance('P')">
Mark All Present
</button>

<button type="button"
  class="all-absent"
  onclick="markAllAttendance('A')">
Mark All Absent
</button>

</div>

<div style="overflow-x:auto;">
  <div id="result"></div>
</div>

<div id="attendanceSummary" style="
display:none;
text-align:center;
margin-top:15px;
font-size:14px;
font-weight:bold;
color:#0b3c5d;">

Total Students: <span id="totalStudents">0</span>
&nbsp; | &nbsp;
Present: <span id="totalPresent">0</span>
&nbsp; | &nbsp;
Absent: <span id="totalAbsent">0</span>

</div>

<div id="downloadSection" style="display:none; text-align:center; margin-top:15px;">
<button onclick="window.open('disclaimer.html','_blank')">Disclaimer</button>
<button onclick="downloadPDF()">Download PDF</button>
</div>

<div class="note">
  <a href="itcell.html" style="text-decoration:none; color:#0f477a;">
    Hosted by IT Cell GEC Munger</a>
  </div>

</div>

</div>

<script>

const API="student_list.json";

async function loadStudents(){

const params = new URLSearchParams(window.location.search);

const branch =
  params.get("branch") ||
  document.getElementById("branch").value;

const semester =
  params.get("semester") ||
  document.getElementById("semester").value;

if(!branch || !semester){
document.getElementById("result").innerHTML="Please select both Branch and Semester";
document.getElementById("downloadSection").style.display="none";
return;
}

const response=await fetch(API);
const data=await response.json();

const filtered=data.filter(row =>
row.Branch===branch && String(row.Semester)===semester
);

document.getElementById("classInfo").innerHTML =
"Branch: " + branch + " | Semester: " + semester;
if(filtered.length===0){
document.getElementById("result").innerHTML='<div style="text-align:center; font-weight:bold; color:red;">Semester not running/No records found</div>';
document.getElementById("downloadSection").style.display="none";
return;
}

let headers = ["Sr. No.", "Reg. Number", "Name", "Roll Number", "Attendance"];

let html="<table>";
html+="<tr>"+headers.map(h=>`<th>${h}</th>`).join("")+"</tr>";

filtered.forEach((row, index) => {

  const attendanceKey = getAttendanceKey(branch, semester, row);
  const savedStatus = getSavedAttendance(attendanceKey);

  html += `
    <tr>
      <td>${row["Sr. No."] || index + 1}</td>
      <td>${row["Reg. Number"] || ""}</td>
      <td>${row["Name"] || ""}</td>
      <td>${row["Roll Number"] || ""}</td>

      <td>
        <button
          type="button"
          class="attendance-btn ${savedStatus === "A" ? "absent" : "present"}"
          data-key="${attendanceKey}"
          onclick="toggleAttendance(this)"
        >
          ${savedStatus}
        </button>
      </td>
    </tr>
  `;
});

html+="</table>";

document.getElementById("result").innerHTML=html;
document.getElementById("downloadSection").style.display="block";
document.getElementById("attendanceControls").style.display = "block";

updateAttendanceSummary();

}

/* =====================================================
   ATTENDANCE STORAGE
   Saved temporarily in browser for maximum 30 minutes
   ===================================================== */

const ATTENDANCE_STORAGE_KEY = "studentAttendanceState";
const ATTENDANCE_EXPIRY = 30 * 60 * 1000; // 30 minutes


function getAttendanceKey(branch, semester, row) {

  return [
    branch,
    semester,
    row["Reg. Number"] || "",
    row["Roll Number"] || "",
    row["Name"] || ""
  ].join("|");

}


/* Get complete saved attendance object */

function getAttendanceData() {

  try {

    const saved =
      localStorage.getItem(ATTENDANCE_STORAGE_KEY);

    if (!saved) {
      return {};
    }

    const data = JSON.parse(saved);

    /* Check 30-minute expiry */

    if (
      !data.timestamp ||
      Date.now() - data.timestamp > ATTENDANCE_EXPIRY
    ) {

      localStorage.removeItem(
        ATTENDANCE_STORAGE_KEY
      );

      return {};
    }

    return data.attendance || {};

  } catch (error) {

    console.error(
      "Unable to read attendance state:",
      error
    );

    return {};
  }

}


/* Get attendance for one student */

function getSavedAttendance(key) {

  const attendance = getAttendanceData();

  return attendance[key] || "P";

}


/* Save attendance */

function saveAttendance(key, status) {

  const attendance =
    getAttendanceData();

  attendance[key] = status;

  const data = {

    timestamp: Date.now(),

    attendance: attendance

  };

  localStorage.setItem(
    ATTENDANCE_STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* P ↔ A */

function toggleAttendance(button) {

  const key =
    button.dataset.key;

  const currentStatus =
    button.textContent.trim();

  const newStatus =
    currentStatus === "P" ? "A" : "P";

  button.textContent =
    newStatus;

  button.classList.toggle(
    "present",
    newStatus === "P"
  );

  button.classList.toggle(
    "absent",
    newStatus === "A"
  );

  saveAttendance(
    key,
    newStatus
  );
  updateAttendanceSummary();

}

function markAllAttendance(status) {

  const buttons = document.querySelectorAll(".attendance-btn");

  buttons.forEach(button => {

    const key = button.dataset.key;

    button.textContent = status;

    button.classList.toggle("present", status === "P");
    button.classList.toggle("absent", status === "A");

    saveAttendance(key, status);

  });

  updateAttendanceSummary();
}


function updateAttendanceSummary() {

  const buttons = document.querySelectorAll(".attendance-btn");

  let present = 0;
  let absent = 0;

  buttons.forEach(button => {

    if (button.textContent.trim() === "P") {
      present++;
    } else {
      absent++;
    }

  });

  document.getElementById("totalStudents").textContent = buttons.length;
  document.getElementById("totalPresent").textContent = present;
  document.getElementById("totalAbsent").textContent = absent;

  document.getElementById("attendanceSummary").style.display = "block";
}

function downloadPDF(){

const result = document.getElementById("result");

if(!result.innerHTML.trim()){
alert("No data to download");
return;
}

/* Create clean container */
const temp = document.createElement("div");

temp.style.width = "100%";
temp.style.width = "800px";
temp.style.padding = "10px";
temp.style.fontFamily = "Georgia";
temp.style.margin = "0 auto";

/* Header */
const header = document.createElement("div");
header.style.textAlign = "center";
header.style.marginBottom = "10px";

const downloadDateTime = new Date().toLocaleString("en-IN", {
  day: "2-digit",
  month: "2-digit",
  year: "numeric",
  hour: "2-digit",
  minute: "2-digit",
  second: "2-digit",
  hour12: true
});

header.innerHTML = `
<h3 style="margin:0;">Government Engineering College Munger</h3>
<p style="margin:2px;">Student Attendance</p>
<p style="margin:2px;">${document.getElementById("classInfo").innerText}</p>
<p style="margin:4px 0 0; font-size:10px;">
  Downloaded on: <b>${downloadDateTime}</b>
</p>
`;

/* Clone table */
const table = result.querySelector("table").cloneNode(true);
/* ---- COLUMN WIDTH FIX (PORTRAIT FIT) ---- */
const headers = table.querySelectorAll("th");

headers.forEach((th, i) => {

if(i === 0) th.style.width = "8%";   // Sr No
if(i === 1) th.style.width = "20%";  // Registration No
if(i === 2) th.style.width = "25%";  // Name
if(i === 3) th.style.width = "15%";  // Roll No
if(i === 4) th.style.width = "15%";  // Remarks

});

/* ---- TEXT WRAP FIX ---- */
table.querySelectorAll("td, th").forEach(el=>{
el.style.wordBreak = "break-word";
});

/* Reduce size */
table.style.fontSize = "9px";
table.style.width = "95%";
table.style.margin = "0 auto";
table.style.tableLayout = "fixed";
table.style.borderCollapse = "collapse";

table.querySelectorAll("th,td").forEach(el=>{
el.style.padding = "4px";
});

/* Append */
temp.appendChild(header);
temp.appendChild(table);
/* Attendance Summary */

const summary = document.createElement("div");

const attendanceButtons =
  document.querySelectorAll(".attendance-btn");

let totalStudents = attendanceButtons.length;
let totalPresent = 0;
let totalAbsent = 0;

attendanceButtons.forEach(button => {

  if (button.textContent.trim() === "P") {
    totalPresent++;
  } else {
    totalAbsent++;
  }

});

summary.style.textAlign = "center";
summary.style.fontSize = "11px";
summary.style.fontWeight = "bold";
summary.style.marginTop = "10px";

summary.innerHTML = `
  Total Students: ${totalStudents}
  &nbsp;&nbsp; | &nbsp;&nbsp;
  Present: ${totalPresent}
  &nbsp;&nbsp; | &nbsp;&nbsp;
  Absent: ${totalAbsent}
`;

temp.appendChild(summary);

temp.style.width = "90%";   // ⭐ IMPORTANT
temp.style.margin = "0 auto";
temp.style.padding = "10px";
temp.style.fontFamily = "Georgia";
temp.style.background = "white";   // ⭐ important

document.body.appendChild(temp);

/* PDF options */
const opt = {
margin: [0.3, 0.5, 0.4, 0.5],
filename: 'Student_List.pdf',
image: { type: 'jpeg', quality: 0.98 },
html2canvas: {
  scale: 2,
  useCORS: true,
  letterRendering: true,
  scrollY: 0
},
jsPDF: {
  unit: 'in',
  format: 'a4',
  orientation: 'portrait'
}
};

setTimeout(()=>{
html2pdf().set(opt).from(temp).save().then(()=>{
temp.remove();
});
}, 300);

}

const params = new URLSearchParams(window.location.search);

if (params.get("branch") && params.get("semester")) {
  document.getElementById("branch").value = params.get("branch");
  document.getElementById("semester").value = params.get("semester");
  loadStudents();
}

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
</html>
