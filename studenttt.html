<!DOCTYPE html>
<html>
<head>
<title>Student Timetable</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
font-family: Georgia, 'Times New Roman', Times, serif, Helvetica, sans-serif;
background: linear-gradient(120deg, #4facfe, #00f2fe);
display: flex;
justify-content: center;
align-items: center;
padding: 10px;
}

.card {
background: #ffffff;
width: 100%;
max-width: 800px;
padding: 80px 40px;
border-radius: 12px;
box-shadow: 0 15px 30px rgba(0,0,0,0.2);
transition: 0.1s;
}

.card.big {
max-width: 1200px;   /* bigger after table shows */
}

h2 {
text-align: center;
color: #0b3c5d;
margin-bottom: 15px;
font-size: 20px;
}

.input-group {
display: flex;
font-family: Georgia, 'Times New Roman', Times, serif, Helvetica, sans-serif;
justify-content: center;
gap: 18px;
margin-bottom: 10px;
flex-wrap: wrap;
font-size: 14px;
}

select, button {
padding: 8px;
font-size: 13px;
border-radius: 6px;
border: 1px solid #0b5592;
min-width: 140px;
width: 100%;
max-width: 100px;
}

button {
background: #0b3c5d;
color: white;
cursor: pointer;
border: none;
}

button:hover {
background: #06263d;
}

.table-wrapper {
width: 100%;
margin-top: 15px;
overflow-x: hidden; /* desktop */
}

table {
border-collapse: collapse;
width: 100%;
background: white;
table-layout: fixed; /* fit table inside card */
}

th, td {
border: 1px solid #ccc;
padding: 10px;
text-align: center;
color: #0b3c5d;
font-size: 13px;
white-space: normal;
word-break: break-word;
}

table {
table-layout: fixed;
}
th {
background: #0b3c5d;
color: white;
font-size: 13px;
position: sticky;
top: 0;
}

td:first-child {
background: #0b3c5d;
color: white;
font-weight: bold;
font-size: 13px;
position: sticky;
left: 0;
white-space: nowrap;
text-align: center;
z-index: 1;
}

th:first-child {
height: 48px;
font-size: 13px;
color: white;
font-weight: bold;
position: sticky;
left: 0;
white-space: nowrap;
width: auto;
z-index: 2;
}

.message {
text-align: center;
margin-top: 12px;
color: red;
font-weight: bold;
}

.logo-container {
text-align: center;
margin-bottom: 10px;
margin-top: 0px;
}

.college-logo {
max-width: 120px;
height: auto;
}

.note {
text-align: center;
margin-top: 18px;
color: #0e4791;
font-weight: bold;
font-size: 12px;
}
/* ------ marging for DownloadPDF button--- */
#downloadSection {
margin-top: 30px; 
}
#downloadSection button {
  margin: 0 10px;
}

/* ===== ACTION BUTTONS FIX ===== */
#downloadSection {
display: flex;
justify-content: center;
gap: 50px;               /* space between buttons (desktop) */
flex-wrap: wrap;
}

.action-btn {
background: #0b3c5d;
color: white;
padding: 6px 12px;
border: none;
border-radius: 6px;
cursor: pointer;
font-size: 12px;
min-width: 100px;
}

.subject-popup,
.faculty-popup{
position:absolute;
background:white;
border:1px solid #ccc;
border-radius:6px;
padding:8px 10px;
font-size:12px;
box-shadow:0 4px 10px rgba(0,0,0,.2);
z-index:1000;
max-width:250px;
}

.subject-popup b,
.faculty-popup b{
color:#0b3c5d;
}

.clickable-code{
cursor:pointer;
font-weight:bold;
}

.subject-code{
color:#0b3c5d;
font-weight:bold;
cursor:pointer;
}

.subject-code:hover{
text-decoration:underline;
}

.faculty-code{
color:green;
font-weight:bold;
cursor:pointer;
}

.faculty-code:hover{
text-decoration:underline;
}
    /* ===== Mobile specific tweaks ===== */
@media (max-width: 600px) {

h2 {
font-size: 16px;
}

th, td {
height: 35px;
font-size: 11px;
}

td:first-child,
th:first-child {
min-width: 70px;
}

.table-wrapper {
overflow-x: auto;
}

table {
min-width: 600px;
}

.controls, 
.form-group {
display: flex;
flex-direction: column;
align-items: center;
}

.card {
background: #ffffff;
width: 95%;
max-width: 600px;
padding: 40px 10px;
border-radius: 14px;
text-align: center;
box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

.input-group {
flex-direction: column;
align-items: center;
max-width: 350px;
}

.college-logo {
max-width: 100px;
}

select, input, button {
width: 50%;
max-width: 350px;
margin: auto;
margin-right: auto;
display: block;
font-size: 12px;
padding: 10px;
}


/* ===== MOBILE ACTION BUTTONS ===== */

#downloadSection {
    width: 50%;
    max-width: 350;
    margin: 20px auto 0 auto;
    padding: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-sizing: border-box;
}

#downloadSection > button {
    display: block;
    width: 300px;
    max-width: 50%;
    margin: 0;
    padding: 12px 10px;
    box-sizing: border-box;
    text-align: center;
}
#downloadSection > button:not(:last-child) {
    margin-bottom: 7px !important;
}
}
</style>
</head>

<body>

<div class="card">

<div class="logo-container">
<img src="gecm_logo.jpg" alt="GEC Munger Logo" class="college-logo">
</div>

<h2>Class Timetable</h2>

<div class="input-group">
<select id="branch">
<option value="">Select Branch</option>
<option value="CE (GA)">CE (GA)</option>
<option value="CE (GB)">CE (GB)</option>
<option value="CSE (DS)">CSE (DS)</option>
<option value="CSE (AI)">CSE (AI)</option>
<option value="CSE (M&C)">CSE (M&C)</option>
<option value="EE">EE</option>
<option value="ME">ME</option>
</select>

<select id="semester">
<option value="">Select Semester</option>
<option value="1">Sem 1</option>
<option value="2">Sem 2</option>
<option value="3">Sem 3</option>
<option value="4">Sem 4</option>
<option value="5">Sem 5</option>
<option value="6">Sem 6</option>
<option value="7">Sem 7</option>
<option value="8">Sem 8</option>
</select>

<button onclick="loadTimetable()">View Timetable</button>
</div>

<div id="classInfo" style="
text-align:center;
margin-bottom:10px;
font-size:15px;
font-weight:bold;
color:#0b3c5d;">
</div>

<div id="tableContainer" class="table-wrapper"></div>
<div id="msg" class="message"></div>

<div id="downloadSection" style="text-align:center; display:none;">

<button onclick="window.open('faculty_info.html','_blank')"
style="
  background:#0b3c5d;
  color:white;
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;">
  Faculty Information
</button>

<button onclick="openSubjectInfo()"
style="
  background:#0b3c5d;
  color:white;
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;">
  Subject Information
</button>

<button onclick="showStudentList()" style="
  background:#0b3c5d;
  color:white;
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;">
  Students List
</button>

<button onclick="downloadPDF()" style="
  background:#0b3c5d;
  color:white;
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;">
  Download (PDF)
</button>

</div>

<div class="note">
<a href="itcell.html" style="text-decoration:none; color:#0f477a;">
IT Cell GEC Munger</a>
</div>

</div>

<script src="timetable-common.js"></script>

<script>


function formatStudentCell(cell) {
    if (!cell) return "";

    cell = cell.trim();

    /* Special entries */
    if (
        cell === "LIB" ||
        cell === "HOLIDAY" ||
        cell === "FREE" ||
        cell === "NPTEL" ||
        cell === "NPTL" ||
        cell === "TUTORIAL" ||
        cell === "Ext Curr Acts"
    ) {
        return cell;
    }

    /* Multiple group entries */
    const entries = cell
        .split(";")
        .map(entry => entry.trim())
        .filter(Boolean);

    let finalHTML = "";

    entries.forEach((entry, index) => {

        const parts = entry.split("|");

        if (parts.length !== 3) {
            finalHTML += `<div>${escapeHTML(entry)}</div>`;
            return;
        }

        let firstPart = parts[0].trim();
        const facultyPart = parts[1].trim();
        const room = parts[2].trim();

        let group = "";
        let subject = firstPart;

        /* Optional group */
        if (firstPart.includes(",")) {

            const commaIndex = firstPart.indexOf(",");

            group = firstPart
                .substring(0, commaIndex)
                .trim();

            subject = firstPart
                .substring(commaIndex + 1)
                .trim();
        }

        /* Faculty */
        const facultyDisplay = facultyPart
            .split("+")
            .map(code => code.trim())
            .filter(Boolean)
            .join(" + ");

        /*
         * LINE 1:
         * G1
         *
         * LINE 2:
         * JAVA-P | ZIA | R-229
         */

        let html = "";

        if (group) {
            html += `
                <div style="
                    font-weight:bold;
                    line-height:1.15;
                    margin-bottom:1px;
                ">
                    ${escapeHTML(group)}
                </div>
            `;
        }

        html += `
            <div style="
                line-height:1.15;
                white-space:normal;
                word-break:break-word;
            ">
                ${subjectLink(subject)}
        `;

        if (facultyDisplay) {
            html += `
                &nbsp;
                ${facultyDisplay
                    .split(" + ")
                    .map(code => facultyLink(code))
                    .join(" + ")}
            `;
        }

        if (room) {
    html += `
        <span style="white-space:nowrap;">
            &nbsp;${escapeHTML(room)}
        </span>
    `;
}

        html += `</div>`;

        finalHTML += `
            <div style="
                margin:1px 0 3px 0;
                line-height:1.15;
            ">
                ${html}
            </div>
        `;

        /* Separator between G1/G2 entries */
        if (index < entries.length - 1) {
            finalHTML += `
                <div style="
                    border-top:1px solid #ddd;
                    margin:2px 0;
                "></div>
            `;
        }
    });

    return finalHTML;
}


const API = "./timetable.json";

let commonDataLoaded = false;

async function loadCommonData() {
try {
const [facultyResponse, subjectResponse] = await Promise.all([
  fetch("./faculty_info.json"),
  fetch("./subject_info.json")
]);

if (!facultyResponse.ok) {
  throw new Error("Unable to load faculty_info.json");
}

if (!subjectResponse.ok) {
  throw new Error("Unable to load subject_info.json");
}

const facultyData = await facultyResponse.json();
const subjectData = await subjectResponse.json();

initializeTimetableCommon(facultyData, subjectData);

commonDataLoaded = true;

} catch (error) {
console.error(error);

document.getElementById("msg").innerText =
  "Unable to load faculty or subject information.";
}
}

async function loadTimetable() {

document.getElementById("classInfo").innerHTML = "";
document.getElementById("classInfo").style.display = "none";
document.getElementById("downloadSection").style.display = "none";

const branch = document.getElementById("branch").value;
const semester = document.getElementById("semester").value;

document.getElementById("msg").innerText = "";
document.getElementById("tableContainer").innerHTML = "";

if (!branch || !semester) {

document.getElementById("msg").innerText =
  "Please select both Branch and Semester";

return;
}
if (!commonDataLoaded) {
await loadCommonData();

if (!commonDataLoaded) {
  return;
}
}

try {

const response = await fetch(API);

if (!response.ok) {
  throw new Error("Unable to load timetable.json");
}

const data = await response.json();

const filtered = data.filter(
  row =>
    String(row.Branch).trim() === branch &&
    String(row.Semester).trim() === semester
);

if (filtered.length === 0) {

  document.getElementById("msg").innerText =
    "No timetable found for selected Branch & Semester";

  return;
}

document.getElementById("downloadSection").style.display = "block";

document.getElementById("classInfo").style.display = "block";

document.getElementById("classInfo").innerHTML =
  `Branch: ${branch}
    &nbsp;&nbsp;|&nbsp;&nbsp;
    Semester: ${semester}`;

renderTable(filtered);

} catch (error) {

console.error(error);

document.getElementById("msg").innerText =
  "Error loading timetable. Please try again.";

}
}

function renderTable(rows) {

const timeSlots = [
"10:00 AM - 11:00 AM",
"11:00 AM - 12:00 PM",
"12:00 PM - 01:00 PM",
"Lunch",
"02:00 PM - 03:00 PM",
"03:00 PM - 04:00 PM",
"04:00 PM - 05:00 PM"
];

let table = `
<table>
  <thead>
    <tr>
      <th>Day</th>
      <th>10:00 AM<br>11:00 AM</th>
      <th>11:00 AM<br>12:00 PM</th>
      <th>12:00 PM<br>01:00 PM</th>
      <th>Lunch<br>Break</th>
      <th>02:00 PM<br>03:00 PM</th>
      <th>03:00 PM<br>04:00 PM</th>
      <th>04:00 PM<br>05:00 PM</th>
    </tr>
  </thead>

  <tbody>
`;

rows.forEach(row => {

table += "<tr>";

/* Day */
table += `<td>${row.Day || ""}</td>`;

/* Time slots */
timeSlots.forEach(slot => {

  const cellData = String(row[slot] || "").trim();

  table += `<td>${formatStudentCell(cellData)}</td>`;

});

table += "</tr>";

});

table += `
  </tbody>
</table>
`;

document.getElementById("tableContainer").innerHTML = table;

document.querySelector(".card").classList.add("big");
}
loadCommonData();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>


function downloadPDF() {

const card = document.querySelector('.card');
const tableWrapper = document.querySelector('.table-wrapper');
card.style.paddingTop = "5px";

const heading = card.querySelector("h2");
const downloadSection = document.getElementById("downloadSection");

heading.style.marginTop = "5px";
heading.style.marginBottom = "5px";

downloadSection.style.marginTop = "5px";
downloadSection.style.marginBottom = "5px";

document.querySelectorAll("th, td").forEach(el => {
el.style.fontSize = "11px";
});

/* ---- TEMP FIX FOR MOBILE PDF ---- */
tableWrapper.style.overflow = "visible";

document.querySelectorAll("th, td").forEach(el => {
el.style.position = "static";
});

const now = new Date();
const dateTime =
now.toLocaleDateString() + " " + now.toLocaleTimeString();

const footer = document.createElement("div");
footer.style.textAlign = "center";
footer.style.fontSize = "11px";
footer.style.marginTop = "10px";
footer.innerHTML = `Downloaded on: <b>${dateTime}</b>`;

card.appendChild(footer);

const opt = {
margin: 0.3,
filename: 'Timetable_' + now.getTime() + '.pdf',
image: { type: 'jpeg', quality: 0.98 },
html2canvas: {
  scale: 2,
  scrollX: 0,
  scrollY: 0,
  useCORS: true
},
jsPDF: {
  unit: 'in',
  format: 'a4',
  orientation: 'landscape'
}
};

html2pdf().set(opt).from(card).save().then(() => {

/* ---- RESTORE UI AFTER DOWNLOAD ---- */
tableWrapper.style.overflowX = "";

document.querySelectorAll("th, td").forEach(el => {
  el.style.position = "";
});

footer.remove();
card.style.paddingTop = "";
document.querySelectorAll("th, td").forEach(el => {
el.style.fontSize = "";
});

heading.style.marginTop = "";
heading.style.marginBottom = "";
downloadSection.style.marginTop = "";
downloadSection.style.marginBottom = "";
});
}

function showStudentList() {
  const branch = document.getElementById("branch").value;
  const semester = document.getElementById("semester").value;

  if (!branch || !semester) return;

  window.location.href =
    "student_list.html?branch=" +
    encodeURIComponent(branch) +
    "&semester=" +
    encodeURIComponent(semester);
}
function openSubjectInfo() {

  const branch = document.getElementById("branch").value;
  const semester = document.getElementById("semester").value;

  if (!branch || !semester) {
    document.getElementById("msg").innerText =
      "Please select both Branch and Semester";
    return;
  }

  window.open(
    "subject_info.html?branch=" +
    encodeURIComponent(branch) +
    "&semester=" +
    encodeURIComponent(semester),
    "_blank"
  );
}

</script>
</body>
</html>
