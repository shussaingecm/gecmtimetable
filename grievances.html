<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GECM Timetable</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #62c8e4;
        }

        .card {
            width: 100%;
            max-width: 850px;
            margin: auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        /* Your own page heading */
        .card-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .card-header h1 {
            margin: 0 0 8px;
            font-size: 22px;
            color: #2a47d9;
        }

        .card-header p {
            margin: 0;
            color: #0a1396;
            font-size: 15px;
        }

        /*
           Google Form container
           The negative top position hides the
           Google Form's own title/description.
        */
        .form-container {
            width: 100%;
            height: 1100px;
            overflow: hidden;
            border-radius: 10px;
            position: relative;
        }

        iframe {
            display: block;
            position: absolute;
            top: -220px;
            left: 0;
            width: 100%;
            height: 2080px;
            border: none;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px 10px;
            }

            .card {
                padding: 15px 10px;
                border-radius: 12px;
            }

            .card-header {
                margin-bottom: 20px;
            }

            .card-header h1 {
                font-size: 23px;
            }

            .card-header p {
                font-size: 14px;
            }

            .form-container {
                height: 2050px;
            }

            iframe {
                top: -305px;
                height: 2350px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="card-header">
            <h1>GECM Timetable Grievances Form</h1>
        </div>

        <div class="form-container">

            <iframe
                src="https://docs.google.com/forms/d/e/1FAIpQLSerNj01pQovjsL-45X9Khx8swwoPkZhcVXVrupqjvU03JAYtw/viewform?embedded=true"
                frameborder="0"
                marginheight="0"
                marginwidth="0">
                Loading…
            </iframe>

        </div>

    </div>

</body>
</html>
